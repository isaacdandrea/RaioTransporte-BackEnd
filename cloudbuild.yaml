options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: raio-transporte-api
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/raio-transporte/api:latest
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '4'
  _SECRET_KEY_SECRET_NAME: django-secret-key
  _API_SHARED_SECRET_NAME: raio-api-shared-secret
  _ALLOWED_HOSTS: raio-transporte-api.example.com
  _CORS_ALLOWED_ORIGIN_REGEXES: '^https://[\w-]+-[\w-]+-[\w-]+-a\.run\.app$'

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      ["build", "-t", "${_IMAGE}", "-f", "mobilidade/Dockerfile", "mobilidade"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--image",
        "${_IMAGE}",
        "--region",
        "${_REGION}",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--port",
        "8080",
        "--min-instances",
        "${_MIN_INSTANCES}",
        "--max-instances",
        "${_MAX_INSTANCES}",
        "--set-secrets",
        "SECRET_KEY=projects/$PROJECT_ID/secrets/${_SECRET_KEY_SECRET_NAME}:latest",
        "--set-secrets",
        "API_SHARED_SECRET=projects/$PROJECT_ID/secrets/${_API_SHARED_SECRET_NAME}:latest",
        "--set-env-vars",
        "ALLOWED_HOSTS=${_ALLOWED_HOSTS}",
        "--set-env-vars",
        "CORS_ALLOWED_ORIGIN_REGEXES=${_CORS_ALLOWED_ORIGIN_REGEXES}"
      ]
images:
  - ${_IMAGE}
