version: '3.9'
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: mobilidade_postgis
    restart: always
    environment:
      POSTGRES_DB: mobilidade
      POSTGRES_USER: mobilidade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
